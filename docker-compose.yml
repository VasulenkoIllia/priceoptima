# PriceOptima: застосунок (API + інтерфейс) і PostgreSQL. Traefik — зовнішня мережа proxy.
services:
  db:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-priceoptima}-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-priceoptima}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # паралельні запити по великому каталогу беруть спільну пам'ять; типових для Docker 64 МБ замало
    shm_size: 512mb
    # розраховано на сервер 8 ГБ (застосунок поруч); на 16 ГБ — PG_SHARED_BUFFERS=4GB, PG_EFFECTIVE_CACHE=10GB
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-5GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=2GB
    # порт відкритий лише на самому сервері (для дампів і ручних запитів)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-priceoptima}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # резервні копії: база щодня, файли щотижня, 14 + 4 копії в ./data/backups і (якщо задано BACKUP_REMOTE) поза сервер
  backup:
    build:
      context: ./backup
    image: ${APP_NAME:-priceoptima}-backup
    container_name: ${APP_NAME:-priceoptima}-backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-priceoptima}
      TZ: ${TZ:-Europe/Kyiv}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ./data/backups:/backups
      - ./data/uploads:/uploads:ro
      - ./data/rclone:/config/rclone
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # остання копія не вдалася — контейнер «unhealthy», причина в data/backups/last-error
      test: ["CMD-SHELL", "test ! -f /backups/last-error"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_NAME:-priceoptima}-app
    container_name: ${APP_NAME:-priceoptima}-app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.priceoptima.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.priceoptima.entrypoints=websecure"
      - "traefik.http.routers.priceoptima.tls.certresolver=cf"
      - "traefik.http.services.priceoptima.loadbalancer.server.port=${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
  internal:
    driver: bridge
