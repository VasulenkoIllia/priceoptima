# PriceOptima — UI-прототип. Один контейнер nginx зі статичною збіркою: демо-дані живуть у браузері (IndexedDB), бази немає.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # вхід у прототип: логін і SHA-256 пароля (printf '%s' 'пароль' | sha256sum)
        VITE_AUTH_LOGIN: ${AUTH_LOGIN:-admin}
        VITE_AUTH_PASSWORD_SHA256: ${AUTH_PASSWORD_SHA256:?set AUTH_PASSWORD_SHA256 in .env}
    image: ${APP_NAME:-priceoptima}-app
    container_name: ${APP_NAME:-priceoptima}-app
    environment:
      TZ: ${TZ:-Europe/Kyiv}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.priceoptima.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.priceoptima.entrypoints=websecure"
      - "traefik.http.routers.priceoptima.tls.certresolver=cf"
      - "traefik.http.services.priceoptima.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
